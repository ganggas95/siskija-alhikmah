name: Migrate Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Alasan menjalankan migration production
        required: true
        type: string
      confirm_target:
        description: Ketik production untuk konfirmasi target database
        required: true
        type: string

concurrency:
  group: production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_target == 'production' }}
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Preflight migration status
        run: pnpm exec prisma migrate status

      - name: Apply production migrations
        run: pnpm db:migrate:deploy
